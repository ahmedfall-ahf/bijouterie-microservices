apiVersion: apps/v1    # Version de l'API Kubernetes utilisée pour les Deployments.
kind: Deployment       # Deployment assure la gestion et le maintien des Pods.
metadata:
  name: backend        # Nom du Deployment.
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend
spec:
  replicas: 2          # Kubernetes doit maintenir deux Pods Backend.
  selector:
    matchLabels:
      app: bijouterie
      tier: backend    # Le sélecteur doit correspondre aux labels du template.
  template:
    metadata:
      labels:
        app: bijouterie
        tier: backend
    spec:
      containers:
        - name: backend
          image: ahmed372/bijouterie-backend:1  # Image Docker du Backend.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000               # Port exposé par le conteneur.
              protocol: TCP

          envFrom:        # envFrom importe toutes les variables non sensibles définies dans backend-config.
            - configMapRef:
                name: backend-config            # Charge les variables non sensibles du ConfigMap.

          env:                    # env permet de déclarer individuellement les variables sensibles.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret          # Référence au Secret Backend.
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD

          resources:
            requests:
              cpu: "100m"                       # Ressource CPU minimale réservée.
              memory: "128Mi"                   # Mémoire minimale réservée.
            limits:
              cpu: "500m"                       # Limite maximale de CPU.
              memory: "512Mi"                   # Limite maximale de mémoire.

          livenessProbe:
            httpGet:
              path: /api/health                 # Vérifie que l'application fonctionne.
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/ready                  # Vérifie que le Backend peut recevoir du trafic.
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3