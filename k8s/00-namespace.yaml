apiVersion: v1    # "v1" est la version de base de l'API pour les namespaces
kind: Namespace   # Namespace permet d'isoler et d'organiser les ressources du cluster
metadata:
  name: bijouterie  # Nom du namespace qui sera créé dans Kubernetes
  labels:           # Labels : étiquettes permettant d'identifier et de sélectionner
    app: bijouterie  # les ressources selon des critères communs.
