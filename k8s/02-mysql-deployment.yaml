
apiVersion: apps/v1      # Version de l'API Kubernetes utilisée pour les Deployments.
kind: Deployment  # Deployment permet de gérer les Pods et de maintenir le nombre de réplicas souhaité.
metadata:
  name: mysql   # Nom du Deployment demandé dans l'énoncé.
  namespace: bijouterie   # Namespace dans lequel sera déployé MySQL.
  labels:     # Labels permettant d'identifier la ressource.
    app: bijouterie
    tier: database

spec:
  replicas: 1   # Nombre de Pods MySQL souhaités.

  strategy:
    type: Recreate  # Arrête l'ancien Pod avant de créer le nouveau pour éviter les conflits d'accès au volume.

  selector:   # Sélecteur permettant au Deployment d'identifier ses Pods.
    matchLabels:
      app: bijouterie
      tier: database

  template:   # Modèle utilisé pour créer les Pods.
    metadata:
      labels:
        app: bijouterie
        tier: database

    spec:
      containers:
        - name: mysql
          image: ahmed372/bijouterie-mysql:14
          ports:    # Port interne utilisé par le serveur MySQL.
            - containerPort: 3306
              name: mysql
              protocol: TCP

          envFrom:    # Injection des variables d'environnement depuis mysql-secret.
            - secretRef:
                name: mysql-secret

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql  # Répertoire où MySQL stocke durablement ses données.

            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d  # Répertoire des scripts d'initialisation MySQL.
              readOnly: true

          resources:    # Ressources CPU et mémoire réservées et maximales.
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          readinessProbe:   # Vérifie que MySQL accepte les connexions.
            exec:
              command:
                - sh
                - -c
                - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          imagePullPolicy: IfNotPresent   # Politique de téléchargement de l'image.

      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc  # Utilisation du PVC pour conserver les données MySQL.

        - name: mysql-init
          configMap:
            name: mysql-init  # Montage du ConfigMap contenant le fichier init.sql.
