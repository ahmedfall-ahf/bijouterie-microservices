apiVersion: v1    # Version de l'API Kubernetes utilisée pour les Secrets.
kind: Secret      # Secret permet de stocker des informations sensibles.
metadata:
  name: backend-secret     # Nom du Secret utilisé par le Backend.
  namespace: bijouterie    # Namespace dans lequel sera créé le Secret.
  labels:                  # Labels permettant d'identifier la ressource.
    app: bijouterie
    tier: backend
type: Opaque       # Type adapté au stockage de données sensibles génériques.
stringData:        # Permet de saisir les valeurs directement en texte clair.
  DB_USER: "AFall"       # Identique à MYSQL_USER dans mysql-secret.
  DB_PASSWORD: "AFall1234"  # Identique à MYSQL_PASSWORD dans mysql-secret.