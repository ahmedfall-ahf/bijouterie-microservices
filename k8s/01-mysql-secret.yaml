apiVersion: v1  # Version de l'API Kubernetes utilisée pour créer le Secret.
kind: Secret  # Type de ressource : Secret permet de stocker des données sensibles.
metadata:   # Métadonnées décrivant le Secret.
  name: mysql-secret    # Nom du Secret utilisé par le conteneur MySQL.
  namespace: bijouterie   # Namespace dans lequel le Secret sera créé.
  labels:    # Labels permettant d'identifier et de sélectionner cette ressource.
    app: bijouterie
    tier: database
type: Opaque    # Opaque convient aux données sensibles génériques.
stringData:   # stringData permet de saisir directement les valeurs en texte clair.
  MYSQL_ROOT_PASSWORD: "Fall1234"   # Mot de passe administrateur MySQL.
  MYSQL_DATABASE: "bijouterie"     # Nom de la base de données utilisée par l'application.
  MYSQL_USER: "AFall"    # Identifiant de l'utilisateur MySQL de l'application.
  MYSQL_PASSWORD: "AFall1234"   # Mot de passe de l'utilisateur MySQL de l'application.